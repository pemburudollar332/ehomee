<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ehomee · Website Monitor</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <h1>ehomee <span class="muted">· website monitor</span></h1>
      <div class="meta">
        <span id="last-updated">memuat…</span>
        <button id="refresh" type="button">Refresh</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="summary" id="summary">
      <div class="card stat"><div class="label">Total</div><div class="value" id="s-total">–</div></div>
      <div class="card stat up"><div class="label">Up</div><div class="value" id="s-up">–</div></div>
      <div class="card stat degraded"><div class="label">Degraded</div><div class="value" id="s-degraded">–</div></div>
      <div class="card stat down"><div class="label">Down</div><div class="value" id="s-down">–</div></div>
    </section>

    <section id="checks" class="grid"></section>

    <section class="history">
      <h2>Riwayat Terakhir</h2>
      <div id="history" class="history-list"></div>
    </section>

    <footer class="foot">
      <p>Data dihasilkan oleh <code>scripts/check.sh</code> via <code>curl</code>. Sumber: <code>data/status.json</code>.</p>
    </footer>
  </main>

  <script src="assets/app.js"></script>
</body>
</html>
